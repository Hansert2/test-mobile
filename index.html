<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #24243a;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --text: #e2e2f0;
      --muted: #6b6b8a;
      --border: #2e2e48;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

    /* Add habit form */
    .add-section {
      padding: 16px 0 8px;
    }

    .add-form {
      display: flex;
      gap: 8px;
    }

    .add-form input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus { border-color: var(--accent); }
    .add-form input::placeholder { color: var(--muted); }

    .add-form button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      line-height: 1;
    }

    .add-form button:active { transform: scale(0.95); }

    /* Date strip */
    .date-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 12px 0 4px;
      scrollbar-width: none;
    }
    .date-strip::-webkit-scrollbar { display: none; }

    .date-btn {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      min-width: 46px;
    }

    .date-btn .day-name { display: block; font-size: 0.65rem; text-transform: uppercase; }
    .date-btn .day-num { display: block; font-size: 1rem; font-weight: 700; margin-top: 2px; }

    .date-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .date-btn.today:not(.active) { border-color: var(--accent2); color: var(--accent2); }

    /* Section label */
    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 20px 0 10px;
    }

    /* Habit cards */
    .habits-list { display: flex; flex-direction: column; gap: 10px; }

    .habit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .habit-card.done { border-color: var(--green); }
    .habit-card.done::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--green);
    }

    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
      color: transparent;
    }

    .habit-card.done .check-btn {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .habit-info { flex: 1; min-width: 0; }

    .habit-name {
      font-size: 1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-card.done .habit-name { color: var(--green); }

    .habit-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--surface2);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent2);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: var(--red); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty .emoji { font-size: 2.5rem; margin-bottom: 12px; }
    .empty p { font-size: 0.9rem; line-height: 1.5; }

    /* Summary bar */
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-stat { text-align: center; }
    .summary-stat .val {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .summary-stat .lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 2px;
    }

    .progress-ring-wrap {
      position: relative;
      width: 54px;
      height: 54px;
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring-bg { fill: none; stroke: var(--surface2); stroke-width: 5; }
    .progress-ring-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s ease;
    }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Habit Tracker</h1>
      <p id="header-date"></p>
    </div>
  </header>

  <div class="container">
    <div class="add-section">
      <div class="add-form">
        <input id="habit-input" type="text" placeholder="New habit…" maxlength="40" />
        <button id="add-btn" title="Add habit">+</button>
      </div>
    </div>

    <div class="date-strip" id="date-strip"></div>

    <div id="summary-wrap"></div>

    <div class="section-label">Today's habits</div>
    <div class="habits-list" id="habits-list"></div>
  </div>

  <script>
    // ── Storage ──────────────────────────────────────────────
    const store = {
      get habits() { return JSON.parse(localStorage.getItem('habits') || '[]'); },
      set habits(v) { localStorage.setItem('habits', JSON.stringify(v)); },
      get completions() { return JSON.parse(localStorage.getItem('completions') || '{}'); },
      set completions(v) { localStorage.setItem('completions', JSON.stringify(v)); },
    };

    // ── Date helpers ──────────────────────────────────────────
    const toKey = d => d.toISOString().slice(0, 10);

    let selectedDate = toKey(new Date());

    function getLast7() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d);
      }
      return days;
    }

    function getStreak(habitId) {
      const completions = store.completions;
      let streak = 0;
      const d = new Date();
      while (true) {
        const key = toKey(d);
        const done = (completions[key] || []).includes(habitId);
        if (!done) break;
        streak++;
        d.setDate(d.getDate() - 1);
      }
      return streak;
    }

    // ── Render ────────────────────────────────────────────────
    function renderDateStrip() {
      const strip = document.getElementById('date-strip');
      const todayKey = toKey(new Date());
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      strip.innerHTML = getLast7().map(d => {
        const key = toKey(d);
        const isToday = key === todayKey;
        const isActive = key === selectedDate;
        return `<button class="date-btn${isActive ? ' active' : ''}${isToday && !isActive ? ' today' : ''}"
          data-key="${key}">
          <span class="day-name">${days[d.getDay()]}</span>
          <span class="day-num">${d.getDate()}</span>
        </button>`;
      }).join('');

      strip.querySelectorAll('.date-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedDate = btn.dataset.key;
          renderDateStrip();
          renderSummary();
          renderHabits();
        });
      });
    }

    function renderSummary() {
      const wrap = document.getElementById('summary-wrap');
      const habits = store.habits;
      if (!habits.length) { wrap.innerHTML = ''; return; }

      const completions = store.completions;
      const done = (completions[selectedDate] || []);
      const count = done.filter(id => habits.find(h => h.id === id)).length;
      const total = habits.length;
      const pct = total ? Math.round((count / total) * 100) : 0;

      const R = 22, C = 2 * Math.PI * R;
      const offset = C - (pct / 100) * C;

      wrap.innerHTML = `
        <div class="summary">
          <div class="summary-stat">
            <div class="val">${count}/${total}</div>
            <div class="lbl">Completed</div>
          </div>
          <div class="progress-ring-wrap">
            <svg class="progress-ring" width="54" height="54">
              <circle class="progress-ring-bg" cx="27" cy="27" r="${R}" />
              <circle class="progress-ring-fill" cx="27" cy="27" r="${R}"
                stroke-dasharray="${C}"
                stroke-dashoffset="${offset}" />
            </svg>
            <div class="ring-label">${pct}%</div>
          </div>
          <div class="summary-stat">
            <div class="val">${getBestStreak()}</div>
            <div class="lbl">Best streak</div>
          </div>
        </div>`;
    }

    function getBestStreak() {
      const habits = store.habits;
      if (!habits.length) return 0;
      return Math.max(...habits.map(h => getStreak(h.id)));
    }

    function renderHabits() {
      const list = document.getElementById('habits-list');
      const habits = store.habits;
      const completions = store.completions;
      const done = completions[selectedDate] || [];

      if (!habits.length) {
        list.innerHTML = `<div class="empty">
          <div class="emoji">🌱</div>
          <p>No habits yet.<br>Add one above to get started!</p>
        </div>`;
        return;
      }

      list.innerHTML = habits.map(h => {
        const isDone = done.includes(h.id);
        const streak = getStreak(h.id);
        return `<div class="habit-card${isDone ? ' done' : ''}" data-id="${h.id}">
          <button class="check-btn" data-id="${h.id}">✓</button>
          <div class="habit-info">
            <div class="habit-name">${escHtml(h.name)}</div>
            <div class="habit-meta">
              ${streak > 0 ? `<span class="streak-badge">🔥 ${streak} day streak</span>` : 'No streak yet'}
            </div>
          </div>
          <button class="delete-btn" data-delete="${h.id}" title="Remove">✕</button>
        </div>`;
      }).join('');

      list.querySelectorAll('.check-btn').forEach(btn => {
        btn.addEventListener('click', () => toggle(btn.dataset.id));
      });

      list.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteHabit(btn.dataset.delete));
      });
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Actions ───────────────────────────────────────────────
    function addHabit(name) {
      name = name.trim();
      if (!name) return;
      const habits = store.habits;
      habits.push({ id: Date.now().toString(36), name });
      store.habits = habits;
      render();
    }

    function toggle(id) {
      const completions = store.completions;
      const list = completions[selectedDate] || [];
      const idx = list.indexOf(id);
      if (idx === -1) list.push(id);
      else list.splice(idx, 1);
      completions[selectedDate] = list;
      store.completions = completions;
      renderSummary();
      renderHabits();
    }

    function deleteHabit(id) {
      store.habits = store.habits.filter(h => h.id !== id);
      const completions = store.completions;
      Object.keys(completions).forEach(k => {
        completions[k] = completions[k].filter(i => i !== id);
      });
      store.completions = completions;
      render();
    }

    function render() {
      renderDateStrip();
      renderSummary();
      renderHabits();
    }

    // ── Header date ───────────────────────────────────────────
    function setHeaderDate() {
      const d = new Date();
      document.getElementById('header-date').textContent =
        d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    // ── Event listeners ───────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', () => {
      const input = document.getElementById('habit-input');
      addHabit(input.value);
      input.value = '';
      input.focus();
    });

    document.getElementById('habit-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('add-btn').click();
    });

    // ── Init ──────────────────────────────────────────────────
    setHeaderDate();
    render();
  </script>
</body>
</html>
