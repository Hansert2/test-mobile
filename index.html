<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coat Check</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2e2e48;
      --text: #e2e2f0;
      --muted: #6b6b8a;
      --yes: #34d399;
      --no: #f87171;
      --accent: #7c6af7;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .form {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 40px;
    }

    .form input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form input:focus { border-color: var(--accent); }
    .form input::placeholder { color: var(--muted); }

    .form button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .form button:active { transform: scale(0.96); }
    .form button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Answer */
    .answer {
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    .answer.hidden { display: none; }

    .verdict {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
    }

    .verdict.yes { color: var(--yes); }
    .verdict.no  { color: var(--no); }

    .temp {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .reason {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Loading */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .loading.show { display: flex; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error {
      display: none;
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      color: var(--no);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 0.9rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }

    .error.show { display: block; }
  </style>
</head>
<body>
  <h1>Should I wear a coat?</h1>

  <div class="form">
    <input id="city" type="text" placeholder="Enter a city…" autocomplete="off" />
    <button id="check-btn">Check</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Checking weather…</span>
  </div>

  <div class="error" id="error"></div>

  <div class="answer hidden" id="answer">
    <div class="verdict" id="verdict"></div>
    <div class="temp" id="temp"></div>
    <div class="reason" id="reason"></div>
  </div>

  <script>
    const COAT_THRESHOLD = 15;

    const cityInput = document.getElementById('city');
    const checkBtn  = document.getElementById('check-btn');
    const loading   = document.getElementById('loading');
    const errorBox  = document.getElementById('error');
    const answer    = document.getElementById('answer');
    const verdict   = document.getElementById('verdict');
    const tempEl    = document.getElementById('temp');
    const reasonEl  = document.getElementById('reason');

    function showLoading() {
      loading.classList.add('show');
      errorBox.classList.remove('show');
      answer.classList.add('hidden');
    }

    function showError(msg) {
      loading.classList.remove('show');
      errorBox.textContent = msg;
      errorBox.classList.add('show');
      answer.classList.add('hidden');
    }

    function showAnswer(city, temp) {
      loading.classList.remove('show');
      errorBox.classList.remove('show');

      const needCoat = temp < COAT_THRESHOLD;
      verdict.textContent = needCoat ? 'YES' : 'NO';
      verdict.className = 'verdict ' + (needCoat ? 'yes' : 'no');
      tempEl.textContent = `${temp}°C in ${city}`;
      reasonEl.textContent = needCoat
        ? `It's cold out there — don't forget your coat.`
        : `Nice and warm — no coat needed today.`;

      answer.classList.remove('hidden');
    }

    async function checkWeather() {
      const city = cityInput.value.trim();
      if (!city) { cityInput.focus(); return; }

      checkBtn.disabled = true;
      showLoading();

      try {
        const geoRes = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
        );
        const geoData = await geoRes.json();

        if (!geoData.results?.length) {
          showError(`Couldn't find "${city}". Try a different city name.`);
          return;
        }

        const { latitude, longitude, name, country } = geoData.results[0];
        const displayName = country ? `${name}, ${country}` : name;

        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
        );
        const weatherData = await weatherRes.json();
        const temp = Math.round(weatherData.current_weather.temperature);

        showAnswer(displayName, temp);
      } catch {
        showError('Could not fetch weather. Check your connection and try again.');
      } finally {
        checkBtn.disabled = false;
      }
    }

    checkBtn.addEventListener('click', checkWeather);
    cityInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkWeather(); });
  </script>
</body>
</html>
